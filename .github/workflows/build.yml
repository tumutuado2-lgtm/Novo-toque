name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair project.zip (se existir)
        run: |
          if [ -f project.zip ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name project.zip -exec rm -rf {} +
            unzip -o project.zip -d _tmp
            cp -r _tmp/. .
            rm -rf _tmp project.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Adiciona codigo-fonte do New Touch"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk New-Touch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: New-Touch-APK
          path: New-Touch.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: New Touch v1.0.${{ github.run_number }}
          files: New-Touch.apk
